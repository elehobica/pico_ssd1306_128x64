name: Build

on: [push, pull_request]

jobs:
  build-binaries:
    strategy:
      matrix:
        project: [test]
        build: [build, build2, build_zero]
        include:
          - build: build
            platform: rp2040
            board: pico
          - build: build2
            platform: rp2350
            board: pico2
          - build: build_zero
            platform: rp2040
            board: waveshare_rp2040_zero
    runs-on: ubuntu-latest
    env:
      RELEASE_DIR: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build
        uses: ./.github/actions/build-and-rename
        with:
          path: ${{ matrix.project }}
          build: ${{ matrix.build }}
          platform: ${{ matrix.platform }}
          board: ${{ matrix.board }}
          identifier: ${{ matrix.board}}
          output_path: ${{ env.RELEASE_DIR }}
      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-binaries-${{ matrix.project }}-${{ matrix.board }}
          path: |
            ${{ env.RELEASE_DIR }}/*.uf2
            ${{ env.RELEASE_DIR }}/*.elf

  release-tag-condition:
    runs-on: ubuntu-latest
    outputs:
      matched: ${{ steps.check.outputs.matched }}
    steps:
      - name: Check if Release Tag Condition Matched
        id: check
        run: |
          if [[ ${{ github.ref_type }} == 'tag' && ${{ github.ref_name }} =~ ^[0-9]+.[0-9]+.[0-9]+$ ]]; then
            echo "matched=true" >> $GITHUB_OUTPUT
            echo "Release tag condition matched"
          else
            echo "matched=false" >> $GITHUB_OUTPUT
            echo "Release tag condition not matched"
          fi

  call-upload-release-asset:
    needs: [build-binaries, release-tag-condition]
    if: ${{ needs.release-tag-condition.outputs.matched == 'true' }}
    # the called workflow needs these; without an explicit grant the caller
    # falls back to the repository default (read-only) and validation fails
    # at startup (even when the if: above is false).
    # actions: read is for gh run download (the artifact listing is an actions
    # API; an explicit permissions block sets everything not listed to none)
    permissions:
      contents: write
      checks: write
      actions: read
    uses: ./.github/workflows/upload-release-asset.yml
    with:
      source_run_id: ${{ github.run_id }}
      artifacts_dirs: "dist-binaries-*"
